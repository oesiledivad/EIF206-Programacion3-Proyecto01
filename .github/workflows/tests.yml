name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unitarias y autenticación MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_PORT: '3307'
      MYSQL_PASSWORD: reservas_ci_password
      MYSQL_ROOT_PASSWORD: root_ci_password
      DB_URL: jdbc:mysql://127.0.0.1:3307/sistema_reservas
      DB_USER: reservas_app
      DB_PASSWORD: reservas_ci_password

    steps:
      - name: Checkout código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Preparar pantalla virtual
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Iniciar MySQL con el esquema del proyecto
        run: |
          cp .config/docker.env.example .config/docker.env
          docker compose --project-name eif206-ci --env-file .config/docker.env up -d --wait mysql

      - name: Compilar módulos y ejecutar pruebas unitarias e integración de autenticación
        run: >-
          xvfb-run -a ./mvnw --batch-mode --no-transfer-progress verify
          -Dit.test=UsuariosIntegracionIT,FuncionariosIntegracionIT,ServerIntegracionIT,LoginIntegracionIT
          -Dfailsafe.failIfNoSpecifiedTests=false

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Mostrar diagnóstico de MySQL
        if: failure()
        run: docker compose --project-name eif206-ci --env-file .config/docker.env logs --no-color mysql

      - name: Apagar MySQL y eliminar los datos de CI
        if: always()
        run: |
          if [ -f .config/docker.env ]; then
            docker compose --project-name eif206-ci --env-file .config/docker.env down --volumes --remove-orphans
          fi
