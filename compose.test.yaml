name: eif206-tests

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sistema_reservas
      MYSQL_USER: reservas_app
      MYSQL_PASSWORD: reservas_test_password
      MYSQL_ROOT_PASSWORD: root_test_password
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_test_data:
